<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 로또 번호 생성기 | 생년월일·이름·커플 궁합 맞춤 번호 추출</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #eef2ff;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-700: #334155;
            --slate-600: #475569;
            --slate-500: #64748b;
            --slate-400: #94a3b8;
            --slate-200: #e2e8f0;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --ball-yellow: #f59e0b;
            --ball-blue: #3b82f6;
            --ball-red: #ef4444;
            --ball-gray: #64748b;
            --ball-green: #10b981;
            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: transparent;
            color: var(--slate-800);
            line-height: 1.5;
            padding: 10px 0 20px 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        .app-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 14px;
            background: #fef3c7;
            color: #b45309;
            font-size: 12.5px;
            font-weight: 700;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .app-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--slate-900);
            letter-spacing: -0.6px;
            margin-bottom: 6px;
        }

        .app-subtitle {
            font-size: 13.5px;
            color: var(--slate-500);
        }

        /* Mode Selector Tabs */
        .mode-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 24px;
            scrollbar-width: thin;
        }

        .mode-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            background: #ffffff;
            border: 1.5px solid var(--slate-200);
            border-radius: 12px;
            color: var(--slate-600);
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        .mode-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1.35fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Card Common */
        .card {
            background: #ffffff;
            border: 1px solid var(--slate-200);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
        }

        .card-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--slate-900);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--slate-700);
            margin-bottom: 6px;
        }

        .input-text, .select-box {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            font-size: 14px;
            border: 1.5px solid var(--slate-200);
            border-radius: var(--radius-md);
            background: #ffffff;
            color: var(--slate-900);
            transition: all 0.2s ease;
        }

        .input-text:focus, .select-box:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .helper-text {
            font-size: 11.5px;
            color: var(--slate-400);
            margin-top: 5px;
            line-height: 1.4;
        }

        .option-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            background: var(--slate-50);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--slate-200);
        }

        .checkbox-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--slate-700);
            cursor: pointer;
        }

        .action-btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.3);
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.4);
        }

        .action-btn:active {
            transform: translateY(1px);
        }

        /* Result Section */
        .result-box {
            background: #ffffff;
            border: 1px solid var(--slate-200);
            border-radius: var(--radius-xl);
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
        }

        .fun-quote {
            background: #fefce8;
            border: 1px solid #fef08a;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 700;
            color: #854d0e;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        /* Games List (A to E) */
        .game-row {
            background: var(--slate-50);
            border: 1px solid var(--slate-200);
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .game-row:hover {
            border-color: #cbd5e1;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .game-tag {
            font-size: 14px;
            font-weight: 900;
            color: var(--primary);
            width: 28px;
        }

        .balls-wrap {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .lotto-ball {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14.5px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            box-shadow: 0 3px 6px rgba(0,0,0,0.15), inset 0 2px 4px rgba(255,255,255,0.4);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) backwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.3) rotate(-30deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        /* Color classes */
        .ball-y { background: radial-gradient(circle at 35% 35%, #fbbf24, #d97706); }
        .ball-b { background: radial-gradient(circle at 35% 35%, #60a5fa, #2563eb); }
        .ball-r { background: radial-gradient(circle at 35% 35%, #f87171, #dc2626); }
        .ball-g { background: radial-gradient(circle at 35% 35%, #94a3b8, #475569); }
        .ball-gr { background: radial-gradient(circle at 35% 35%, #34d399, #059669); }

        .game-summary {
            font-size: 11.5px;
            color: var(--slate-500);
            font-weight: 600;
            text-align: right;
            min-width: 60px;
        }

        /* Result Buttons */
        .result-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .btn-sub {
            flex: 1;
            height: 42px;
            background: #ffffff;
            border: 1.5px solid var(--slate-200);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 700;
            color: var(--slate-700);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-sub:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        /* Number Stats & Info */
        .stat-banner {
            margin-top: 24px;
            background: var(--slate-50);
            border: 1px dashed var(--slate-200);
            border-radius: var(--radius-md);
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--slate-600);
        }

        .color-legend {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--slate-500);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="app-header">
            <span class="badge-pill">🍀 인생 대박 기원 맞춤 추첨</span>
            <h1 class="app-title">스마트 로또 6/45 번호 생성기</h1>
            <p class="app-subtitle">생년월일·이름·커플 궁합·연락처 수비학 분석을 통한 나만의 맞춤형 행운 번호 추출</p>
        </div>

        <!-- Mode Navigation -->
        <div class="mode-nav">
            <button class="mode-btn active" onclick="switchMode('birth')">🎂 생년월일 조합</button>
            <button class="mode-btn" onclick="switchMode('name')">🔤 이름 수비학 변환</button>
            <button class="mode-btn" onclick="switchMode('couple')">👩‍❤️‍👨 두 사람(커플) 궁합</button>
            <button class="mode-btn" onclick="switchMode('name_birth')">🌟 이름 + 생년월일</button>
            <button class="mode-btn" onclick="switchMode('phone')">📱 휴대폰 연락처</button>
            <button class="mode-btn" onclick="switchMode('name_phone')">💼 이름 + 연락처</button>
            <button class="mode-btn" onclick="switchMode('pure_auto')">🎲 스마트 완전 자동</button>
        </div>

        <!-- Main Layout -->
        <div class="main-grid">
            <!-- Left Form Card -->
            <div class="card">
                <div class="card-title" id="formTitle">
                    <span>🎂</span> 생년월일 기반 행운 번호
                </div>

                <div id="dynamicForm">
                    <!-- Dynamic inputs injected by JS -->
                </div>

                <div class="option-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="todaySeed" checked>
                        <span>오늘 날짜 운세 기운 반영하기</span>
                    </label>
                </div>

                <div class="form-group">
                    <label class="form-label">생성할 게임 수</label>
                    <select class="select-box" id="gameCount">
                        <option value="5" selected>5게임 (1세트 5,000원 권장)</option>
                        <option value="3">3게임 (3,000원)</option>
                        <option value="1">1게임 (1,000원 단판)</option>
                    </select>
                </div>

                <button class="action-btn" id="generateBtn" onclick="generateLottoNumbers()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                    대박 기운 행운 번호 추출하기
                </button>
            </div>

            <!-- Right Result Card -->
            <div class="result-box">
                <div class="card-title" style="justify-content: space-between; margin-bottom: 12px;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span>🎟️</span> 추출된 로또 번호
                    </div>
                    <span style="font-size:12px; font-weight:700; color:#059669; background:#ecfdf5; padding:3px 10px; border-radius:999px;">동행복권 6/45 규격</span>
                </div>

                <!-- Fun Commentary Quote -->
                <div class="fun-quote" id="funQuote">
                    ✨ 대박의 기운이 감도는 번호입니다! 이번 주 1등의 주인공은 바로 당신!
                </div>

                <!-- Games Container -->
                <div id="gamesContainer">
                    <!-- Dynamic game rows rendered here -->
                </div>

                <!-- Action Buttons -->
                <div class="result-actions">
                    <button class="btn-sub" onclick="copyNumbers()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        번호 복사하기
                    </button>
                    <button class="btn-sub" onclick="window.open('https://m.dhlottery.co.kr/qr.do?method=checkNumber', '_blank')">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><rect x="7" y="7" width="10" height="10"></rect></svg>
                        동행복권 QR 당첨확인
                    </button>
                </div>

                <!-- Color Ball Legend -->
                <div class="stat-banner">
                    <span style="font-weight:700;">공 색상 구분:</span>
                    <div class="color-legend">
                        <div class="legend-item"><span class="dot" style="background:#f59e0b;"></span> 1~10</div>
                        <div class="legend-item"><span class="dot" style="background:#3b82f6;"></span> 11~20</div>
                        <div class="legend-item"><span class="dot" style="background:#ef4444;"></span> 21~30</div>
                        <div class="legend-item"><span class="dot" style="background:#64748b;"></span> 31~40</div>
                        <div class="legend-item"><span class="dot" style="background:#10b981;"></span> 41~45</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'birth';
        let latestGames = [];

        // Mode Form Configurations
        const modeConfigs = {
            birth: {
                title: '🎂 생년월일 기반 행운 번호',
                fields: `
                    <div class="form-group">
                        <label class="form-label">생년월일 선택 (양력/음력 무관)</label>
                        <input type="date" class="input-text" id="inputBirth" value="1995-05-18">
                        <p class="helper-text">태어난 날짜의 사주 운세와 오행 수비학을 결합하여 고유 번호를 도출합니다.</p>
                    </div>
                `
            },
            name: {
                title: '🔤 이름 수비학 변환 행운 번호',
                fields: `
                    <div class="form-group">
                        <label class="form-label">이름 입력 (한글 또는 영문)</label>
                        <input type="text" class="input-text" id="inputName" placeholder="예: 홍길동" value="홍길동">
                        <p class="helper-text">이름의 한글 유니코드 초성·중성·종성 획수와 음양오행 파동 에너지를 번호로 변환합니다.</p>
                    </div>
                `
            },
            couple: {
                title: '👩‍❤️‍👨 두 사람(커플·부부) 궁합 로또',
                fields: `
                    <div class="form-group">
                        <label class="form-label">내 이름 (또는 첫 번째 사람)</label>
                        <input type="text" class="input-text" id="coupleName1" placeholder="예: 김민수" value="김민수">
                    </div>
                    <div class="form-group">
                        <label class="form-label">상대방 이름 (또는 두 번째 사람)</label>
                        <input type="text" class="input-text" id="coupleName2" placeholder="예: 이서연" value="이서연">
                        <p class="helper-text">두 사람의 인연 궁합 수치를 계산하고 함께 샀을 때 시너지가 터지는 행운의 6자리 번호를 조합합니다.</p>
                    </div>
                `
            },
            name_birth: {
                title: '🌟 이름 + 생년월일 사주 운명 로또',
                fields: `
                    <div class="form-group">
                        <label class="form-label">이름</label>
                        <input type="text" class="input-text" id="nbName" placeholder="예: 박지훈" value="박지훈">
                    </div>
                    <div class="form-group">
                        <label class="form-label">생년월일</label>
                        <input type="date" class="input-text" id="nbBirth" value="1992-10-24">
                        <p class="helper-text">이름의 파동과 타고난 사주 생년월일을 크로스 분석하여 평생의 재물운 번호를 생성합니다.</p>
                    </div>
                `
            },
            phone: {
                title: '📱 휴대폰 연락처 기반 행운 번호',
                fields: `
                    <div class="form-group">
                        <label class="form-label">휴대폰 번호 (숫자만 입력 가능)</label>
                        <input type="tel" class="input-text" id="inputPhone" placeholder="예: 010-1234-5678" value="010-5842-8921">
                        <p class="helper-text">매일 가장 많이 사용하는 연락처의 8자리 고유 주파수를 분석하여 당첨 확률을 높입니다.</p>
                    </div>
                `
            },
            name_phone: {
                title: '💼 이름 + 연락처 비즈니스 대박 로또',
                fields: `
                    <div class="form-group">
                        <label class="form-label">이름</label>
                        <input type="text" class="input-text" id="npName" placeholder="예: 최동훈" value="최동훈">
                    </div>
                    <div class="form-group">
                        <label class="form-label">연락처</label>
                        <input type="tel" class="input-text" id="npPhone" placeholder="예: 010-9876-5432" value="010-3321-7789">
                        <p class="helper-text">나의 사회적 신원(이름)과 소통 채널(연락처)의 기운을 모아 금전운을 극대화합니다.</p>
                    </div>
                `
            },
            pure_auto: {
                title: '🎲 스마트 완전 자동 & 통계 가중치',
                fields: `
                    <div class="form-group">
                        <label class="form-label">추첨 가중치 알고리즘</label>
                        <select class="select-box" id="autoAlgo">
                            <option value="pure">100% 완전 난수 (암호학적 순수 무작위)</option>
                            <option value="hot">역대 다출현 번호 가중치 (HOT 넘버 전략)</option>
                            <option value="cold">장기 미출현 번호 우선 (COLD 반등 전략)</option>
                            <option value="balanced">홀짝 3:3 & 고저 균형 (황금 밸런스 필터)</option>
                        </select>
                        <p class="helper-text">동행복권 역대 통계 데이터와 고성능 난수 생성기를 결합한 전문 추출 모드입니다.</p>
                    </div>
                `
            }
        };

        // Switch Mode
        function switchMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            const conf = modeConfigs[mode];
            document.getElementById('formTitle').innerHTML = conf.title;
            document.getElementById('dynamicForm').innerHTML = conf.fields;
            generateLottoNumbers();
        }

        // String Hash Generator for Deterministic Seed
        function hashString(str) {
            let hash = 5381;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) + hash) + str.charCodeAt(i);
                hash = hash & hash; // Convert to 32bit integer
            }
            return Math.abs(hash);
        }

        // Pseudo-random generator with seed
        function mulberry32(a) {
            return function() {
                let t = a += 0x6D2B79F5;
                t = Math.imul(t ^ t >>> 15, t | 1);
                t ^= t + Math.imul(t ^ t >>> 7, t | 61);
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            }
        }

        // Core Generator
        function generateLottoNumbers() {
            const count = parseInt(document.getElementById('gameCount').value, 10);
            const useTodaySeed = document.getElementById('todaySeed').checked;
            const todayStr = useTodaySeed ? new Date().toISOString().slice(0, 10) : "";

            let seedBasis = todayStr;
            let funMsg = "✨ 대박의 기운이 감도는 번호입니다! 이번 주 1등의 주인공은 바로 당신!";

            // Extract input by mode
            if (currentMode === 'birth') {
                const birth = document.getElementById('inputBirth')?.value || "1995-05-18";
                seedBasis += "_birth_" + birth;
                funMsg = `🎂 ${birth.slice(0,4)}년생 특유의 기운과 사주 오행이 반영된 황금 번호 세트입니다!`;
            } else if (currentMode === 'name') {
                const name = document.getElementById('inputName')?.value || "홍길동";
                seedBasis += "_name_" + name;
                funMsg = `🔤 '${name}'님의 이름 파동 획수에서 강력한 재물운 수치가 감지되었습니다!`;
            } else if (currentMode === 'couple') {
                const n1 = document.getElementById('coupleName1')?.value || "김민수";
                const n2 = document.getElementById('coupleName2')?.value || "이서연";
                seedBasis += "_couple_" + n1 + "_" + n2;
                const score = 85 + (hashString(n1 + n2) % 15);
                funMsg = `💖 [${n1} ❤️ ${n2}] 두 사람의 로또 인연 궁합은 무려 ${score}점! 함께 사면 당첨 확률 UP!`;
            } else if (currentMode === 'name_birth') {
                const nbN = document.getElementById('nbName')?.value || "박지훈";
                const nbB = document.getElementById('nbBirth')?.value || "1992-10-24";
                seedBasis += "_nb_" + nbN + "_" + nbB;
                funMsg = `🌟 ${nbN}님의 생년월일과 이름 에너지가 결합된 인생 대박 번호입니다!`;
            } else if (currentMode === 'phone') {
                const ph = document.getElementById('inputPhone')?.value || "010-1234-5678";
                seedBasis += "_phone_" + ph.replace(/[^0-9]/g, '');
                funMsg = `📱 매일 행운을 부르는 내 번호(${ph.slice(-4)})의 고유 수비학 조합입니다!`;
            } else if (currentMode === 'name_phone') {
                const npN = document.getElementById('npName')?.value || "최동훈";
                const npP = document.getElementById('npPhone')?.value || "010-3321-7789";
                seedBasis += "_np_" + npN + "_" + npP.replace(/[^0-9]/g, '');
                funMsg = `💼 ${npN}님의 신원과 소통운이 결합된 성공 & 재물 번호입니다!`;
            } else if (currentMode === 'pure_auto') {
                seedBasis += "_auto_" + Math.random();
                funMsg = `🎲 최적의 통계 밸런스로 엄선된 이번 회차 전략 추천 번호입니다!`;
            }

            let seed = hashString(seedBasis) + Date.now() % 1000;
            const prng = mulberry32(seed);

            document.getElementById('funQuote').innerHTML = funMsg;

            latestGames = [];
            const labels = ['A', 'B', 'C', 'D', 'E'];
            const container = document.getElementById('gamesContainer');
            container.innerHTML = '';

            for (let g = 0; g < count; g++) {
                const nums = new Set();
                while (nums.size < 6) {
                    const r = Math.floor(prng() * 45) + 1;
                    nums.add(r);
                }
                const sortedNums = Array.from(nums).sort((a, b) => a - b);
                latestGames.push({ label: labels[g], numbers: sortedNums });

                // Render Game Row
                const row = document.createElement('div');
                row.className = 'game-row';
                
                let ballsHtml = '';
                sortedNums.forEach((n, idx) => {
                    let colorClass = 'ball-y';
                    if (n >= 11 && n <= 20) colorClass = 'ball-b';
                    else if (n >= 21 && n <= 30) colorClass = 'ball-r';
                    else if (n >= 31 && n <= 40) colorClass = 'ball-g';
                    else if (n >= 41 && n <= 45) colorClass = 'ball-gr';

                    ballsHtml += `<div class="lotto-ball ${colorClass}" style="animation-delay: ${idx * 0.06}s">${n}</div>`;
                });

                const sum = sortedNums.reduce((a, b) => a + b, 0);
                const oddCount = sortedNums.filter(n => n % 2 !== 0).length;

                row.innerHTML = `
                    <div style="display:flex; align-items:center; gap:12px;">
                        <span class="game-tag">${labels[g]}</span>
                        <div class="balls-wrap">${ballsHtml}</div>
                    </div>
                    <div class="game-summary">
                        합 ${sum}<br>
                        홀${oddCount}:짝${6-oddCount}
                    </div>
                `;
                container.appendChild(row);
            }
        }

        // Copy Numbers to Clipboard
        function copyNumbers() {
            if (!latestGames.length) return;
            let txt = "🍀 [스마트 로또 6/45 추천 번호]\n";
            latestGames.forEach(g => {
                txt += `${g.label} : ${g.numbers.map(n => String(n).padStart(2, '0')).join(', ')}\n`;
            });
            txt += "출처: Barcode128 스마트 로또 생성기";

            navigator.clipboard.writeText(txt).then(() => {
                alert("추출된 로또 번호가 클립보드에 복사되었습니다!\n원하는 곳에 붙여넣기(Ctrl+V) 하세요.");
            }).catch(() => {
                alert("복사에 실패했습니다. 수동으로 복사해 주세요.");
            });
        }

        // Initial Setup
        window.addEventListener('DOMContentLoaded', () => {
            switchMode('birth');
        });
    </script>
